---

- name: install dependencies
  become: true
  ansible.builtin.apt:
    name: ["language-pack-en", "software-properties-common", "nodejs", "containerd", "openjdk-{{ bbb_java_version }}-jre-headless"]
    update_cache: true

- name: set version of java to use
  become: true
  ansible.builtin.file:
    src: "/usr/lib/jvm/java-{{ bbb_java_version }}-openjdk-amd64/bin/java"
    dest: /etc/alternatives/java
    state: link

- name: install bbb
  become: true
  ansible.builtin.apt:
    name:
      - bigbluebutton
      - bbb-playback-video
      - bbb-playback-podcast

- name: Erase auto-generated postgres database cluster
  become: true
  ansible.builtin.command:
    cmd: pg_dropcluster --stop 14 main
    removes: /var/lib/postgres/14/main

- name: Copy custom postgresql systemd units
  become: true
  ansible.builtin.template:
    src: "{{ item }}"
    dest: /etc/systemd/system
    mode: "644"
  loop:
    - var-lib-postgresql.mount
    - postgresql-cluster-init.service

- name: Enable Postgresql cluster initialization service
  become: true
  ansible.builtin.systemd:
    name: postgresql-cluster-init.service
    state: started
    enabled: true

- name: install extra or updated packages
  become: true
  ansible.builtin.apt:
    deb: "{{ item }}"
  loop: "{{ bbb_additional_packages }}"
  when: bbb_additional_packages is defined
